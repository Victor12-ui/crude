
services:
  app:
    build: .
    container_name: crud-tareas-app
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      PORT: 4000
      DATABASE_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-change_me_local_only}@mongodb:27017/${MONGO_DATABASE:-tareas_db}?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7.0
    container_name: crud-tareas-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change_me_local_only}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-tareas_db}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_data:
